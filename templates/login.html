{% extends 'base.html' %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="card">
    <h2>Login</h2>
    <form method="POST" action="{{ request.url }}">
        <input type="text" name="username" placeholder="Username (e.g. Hunter)" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Sign In</button>
    </form>
</div>
<div class="meta" style="text-align: center; margin-top: 1rem;">
    New here? <a href="{{ url_for('register', invite=request.args.get('invite')) }}" style="color: var(--text);">Create an account</a>.
</div>
{% endblock %}
